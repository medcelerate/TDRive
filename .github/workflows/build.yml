name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # rive-runtime is fetched fresh below

      - name: Install tools
        run: |
          brew update
          brew install premake cmake

      - name: Resolve Rive commit
        id: rive
        run: |
          # Pin the Rive runtime commit so the cache key is stable. If you
          # want a different commit, set RIVE_REF here or as a repo secret.
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Rive runtime
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Cache Rive build outputs
        id: rive-cache
        uses: actions/cache@v4
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-macos-${{ steps.rive.outputs.sha }}-v1

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        # Drop --with_rive_canvas (ORE + D3D11/D3D12/GL ORE backends) - we
        # only use the PLS renderer, and canvas/ORE adds ~30% of build time.
        env:
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout"
        run: ./scripts/build_rive.sh release

      - name: Configure plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Package macOS plugin
        run: |
          mkdir -p dist
          (cd build && zip -r ../dist/TDRive_mac.zip TDRiveTOP.plugin)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDRive_mac
          path: dist/TDRive_mac.zip

  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install premake5
        shell: pwsh
        run: |
          $version = "5.0.0-beta8"
          $url = "https://github.com/premake/premake-core/releases/download/v$version/premake-$version-windows.zip"
          $dest = "$env:RUNNER_TEMP\premake"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dest\premake.zip"
          Expand-Archive -Path "$dest\premake.zip" -DestinationPath $dest
          # Add to PATH for subsequent steps.
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$dest\premake5.exe" --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve Rive commit
        id: rive
        shell: bash
        run: |
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Rive build
        id: rive-cache
        uses: actions/cache@v4
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-windows-${{ steps.rive.outputs.sha }}-v1

      - name: Clone Rive runtime
        shell: bash
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        env:
          # Drop --with_rive_canvas (ORE + D3D11/D3D12/GL ORE backends);
          # not used by TDRiveTOP, and cuts the Windows build down a lot.
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout"
          # Use ninja instead of vs2022/MSBuild. Rive's MSBuild invocation
          # doesn't pass /m, so projects build serially - ninja is fully
          # parallel and finishes in a fraction of the time on CI.
          RIVE_BUILD_SYSTEM: "ninja"
        # Args after `--` are forwarded to ninja as explicit build targets,
        # so we only build the static libs we actually link. Skipping
        # path_fiddle (the GLFW sample exe) avoids the LNK1107 that bites
        # otherwise - and we never use it.
        run: scripts\build_rive.bat release -- rive rive_pls_renderer rive_decoders rive_harfbuzz rive_sheenbidi rive_yoga libpng libjpeg libwebp zlib miniaudio

      - name: Configure plugin
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Package Windows plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\Release\TDRiveTOP.dll -DestinationPath dist\TDRive_win.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDRive_win
          path: dist/TDRive_win.zip

  # ---------------------------------------------------------------------------
  release:
    # Runs only on a v*.*.* tag (e.g. v0.1.0, v1.2.3). Builds both platforms
    # first via 'needs:', then attaches the prepared zips to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TDRive_mac
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TDRive_win
          path: release

      - name: List release files
        run: ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TDRive_mac.zip
            release/TDRive_win.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
