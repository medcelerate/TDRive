name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Called by weekly.yml to build on the self-hosted GPU runners, run the
  # end-to-end texture tests there, and publish a release from those exact
  # artifacts. Push and pull_request runs get none of these inputs, so they
  # fall back to the hosted runners and skip the GPU tests.
  workflow_call:
    inputs:
      mac_runner:
        description: JSON runs-on value for the macOS job
        type: string
        default: '"macos-14"'
      win_runner:
        description: JSON runs-on value for the Windows job
        type: string
        default: '"windows-2022"'
      e2e:
        description: Run tests/texture_io end to end (needs a real GPU; CUDA on Windows)
        type: boolean
        default: false
      release_tag:
        description: Publish a release with this tag from this run's artifacts
        type: string
        default: ''

# Pin the Rive runtime to a specific release tag so CI builds are reproducible
# and match the runtime the plugin has been tested against. Bump this to a newer
# rive-app/rive-runtime tag (https://github.com/rive-app/rive-runtime/releases)
# to move forward deliberately, rather than tracking a moving 'main'.
env:
  RIVE_REF: runtime-v0.1.410

# Cancel in-progress runs for the same ref when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  macos:
    runs-on: ${{ fromJSON(inputs.mac_runner || '"macos-14"') }}   # arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # rive-runtime is fetched fresh below

      - name: Install tools
        run: |
          brew update
          brew install premake cmake

      - name: Resolve Rive commit
        id: rive
        run: |
          # Pin the Rive runtime commit so the cache key is stable. If you
          # want a different commit, set RIVE_REF here or as a repo secret.
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Rive runtime
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Restore Rive build cache
        id: rive-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-macos-${{ steps.rive.outputs.sha }}-v4

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        # --with_rive_canvas compiles in GPU Canvas (RenderCanvas + the Ore
        # GPU abstraction layer, Metal backend on macOS). --with_rive_scripting
        # swaps the stub luau_vm for a real Luau VM (+ libhydrogen), which is
        # what actually makes script-driven GPU Canvas content animate - a
        # canvas without scripting allocates but nothing draws into it.
        env:
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout --with_rive_canvas --with_rive_scripting"
        run: ./scripts/build_rive.sh release

      - name: Setup Python 3.11
        # Headers for the CPython schema endpoint. The runner has no
        # TouchDesigner to borrow them from; the macOS plugin links no
        # libpython, so any 3.11 layout works (see CMakeLists.txt).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure plugin
        run: |
          test -n "$pythonLocation" || { echo "pythonLocation is unset"; exit 1; }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTD_PYTHON_ROOT="$pythonLocation"

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Save Rive build cache
        # Only run after the plugin links - that's our proof the libs are
        # whole. Saves us from poisoning the cache with partial output from
        # a failed Rive build like we did before.
        if: steps.rive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-macos-${{ steps.rive.outputs.sha }}-v4

      - name: Verify CPython schema endpoint
        # Also proves nothing but _Py* symbols is left to load-time lookup.
        # Runs before packaging so a bad binary never becomes a zip.
        run: python3 scripts/verify_python_endpoint.py build/TDRiveTOP.plugin/Contents/MacOS/TDRiveTOP

      - name: End-to-end texture test (Metal)
        # Renders tests/texture_io/texture_io.riv with injected textures and
        # checks orientation, slot routing and alpha. Needs a real GPU, so it
        # only runs when weekly.yml calls this on the self-hosted Mac.
        if: inputs.e2e
        run: ./build/texture_io_test tests/texture_io/texture_io.riv cpu

      - name: Package macOS plugin
        # Bake the pinned Rive tag into the zip name so downloaders can see
        # at a glance which runtime the plugin was built against.
        run: |
          mkdir -p dist
          RIVE_TAG="${RIVE_REF#runtime-}"
          ZIP="TDRive_mac_rive-${RIVE_TAG}.zip"
          (cd build && zip -r "../dist/${ZIP}" TDRiveTOP.plugin)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TDRive_mac
          path: dist/TDRive_mac_rive-*.zip

  # ---------------------------------------------------------------------------
  windows:
    # Pin to windows-2022 for a stable toolchain. 'windows-latest' has rolled
    # to VS 2026 (v18) and dropped VS 2022, which breaks the hardcoded
    # "Visual Studio 17 2022" CMake generator below ("could not find any
    # instance of Visual Studio"). Pinning mirrors the macos-14 pin and keeps
    # release builds reproducible. A self-hosted runner needs VS 2022 too.
    runs-on: ${{ fromJSON(inputs.win_runner || '"windows-2022"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install premake5
        shell: pwsh
        run: |
          $version = "5.0.0-beta8"
          $url = "https://github.com/premake/premake-core/releases/download/v$version/premake-$version-windows.zip"
          $dest = "$env:RUNNER_TEMP\premake"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dest\premake.zip"
          Expand-Archive -Path "$dest\premake.zip" -DestinationPath $dest
          # Add to PATH for subsequent steps.
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$dest\premake5.exe" --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve Rive commit
        id: rive
        shell: bash
        run: |
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Rive runtime
        shell: bash
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Restore Rive build cache
        id: rive-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-windows-${{ steps.rive.outputs.sha }}-v4

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        env:
          # --with_rive_text + --with_rive_layout + --with_rive_canvas: the
          # canvas flag compiles in GPU Canvas (RenderCanvas + Ore, D3D11/D3D12
          # backends on Windows) and matches Rive's own default build flags.
          # --with_rive_scripting: swap the stub luau_vm for a real Luau VM
          # (+ libhydrogen). Required for script-driven GPU Canvas content
          # (the common case in Rive editor authoring) to actually animate.
          # --no-lto: Rive's release config enables LTO on Windows, which
          # makes clang-cl emit LLVM-bitcode-wrapped COFF objs/libs that
          # MSVC's link.exe can't consume - we hit LNK1107 the moment we
          # try to link against rive*.lib from the TDRiveTOP CMake build.
          # Turning LTO off restores standard COFF that link.exe groks.
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout --with_rive_canvas --with_rive_scripting --no-lto"
          # Use ninja instead of vs2022/MSBuild. Rive's MSBuild invocation
          # doesn't pass /m, so projects build serially - ninja is fully
          # parallel and finishes in a fraction of the time on CI.
          RIVE_BUILD_SYSTEM: "ninja"
        # Args after `--` are forwarded to ninja as explicit build targets,
        # so we only build the static libs we actually link. Skipping
        # path_fiddle (the GLFW sample exe) avoids dragging GLFW + the
        # other fiddle backends into the build. luau_vm is produced by
        # --with_rive_scripting; libhydrogen isn't a standalone project,
        # its objects are linked directly into librive.
        run: scripts\build_rive.bat release -- rive rive_pls_renderer rive_decoders rive_harfbuzz rive_sheenbidi rive_yoga libpng libjpeg libwebp zlib miniaudio luau_vm

      - name: Setup Python 3.11
        # The CPython schema endpoint (pythonGetSets) needs Python headers and
        # python3.lib at build time. On a dev box CMake borrows them from a
        # TouchDesigner install; this runner has no TouchDesigner, so we supply
        # a stock CPython instead and point TD_PYTHON_ROOT at it below. Without
        # this the old CMake lookup missed, warned, and shipped a plugin with
        # the whole endpoint compiled out.
        #
        # 3.11 deliberately: it matches Py_LIMITED_API=0x030B0000 in
        # CMakeLists.txt, the PEP 384 floor TD 2023+ ships. The stable ABI is
        # what lets one DLL serve 3.11.1 (2023.x) through 3.11.15 (2025.33230),
        # so the patch level here does not matter - the major.minor does.
        #
        # Placed after the Rive build so it cannot perturb premake/ninja.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure plugin
        shell: pwsh
        run: |
          # setup-python exports pythonLocation; its layout is
          # <root>/include/Python.h + <root>/libs/python3.lib, the second of the
          # two roots CMakeLists.txt accepts.
          if (-not $env:pythonLocation) {
            throw "pythonLocation is unset - the Setup Python step did not run."
          }
          $pyRoot = $env:pythonLocation -replace '\\', '/'   # CMake wants forward slashes
          Write-Host "TD_PYTHON_ROOT=$pyRoot"
          # Echo the two files CMake requires. If setup-python ever changes its
          # layout, this turns a terse configure failure into an obvious one.
          foreach ($f in 'include/Python.h', 'libs/python3.lib') {
            $p = Join-Path $pyRoot $f
            Write-Host ("  {0,-20} {1}" -f $f, $(if (Test-Path $p) { 'found' } else { 'MISSING' }))
          }
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DTD_PYTHON_ROOT="$pyRoot"

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Save Rive build cache
        # Only after a successful plugin link, so we never poison the cache
        # with a half-built Rive output (this is exactly what bit us with
        # the v1 key after the path_fiddle.exe failure).
        if: steps.rive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-windows-${{ steps.rive.outputs.sha }}-v4

      - name: Verify CPython schema endpoint
        # Gate the artifact on what it actually contains, not on the build
        # having gone green. A plugin missing TDRIVE_PYTHON compiles, links,
        # loads and renders normally - the only symptom is that every
        # documented Python attribute raises AttributeError in TouchDesigner.
        # CMake is now fatal when it cannot find a Python SDK, but this checks
        # the DLL itself, so no configuration change can quietly undo it.
        # Runs BEFORE packaging so a stripped DLL never becomes a zip.
        shell: pwsh
        run: python scripts/verify_python_endpoint.py build\Release\TDRiveTOP.dll

      - name: End-to-end texture test (D3D11)
        if: inputs.e2e
        shell: pwsh
        run: |
          build\Release\texture_io_test.exe tests\texture_io\texture_io.riv cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: End-to-end texture test (CUDA)
        # Asked for explicitly, so a machine without CUDA fails (exit 2)
        # instead of skipping. cudart has to be findable: set the repo
        # variable TDRIVE_CUDART_DIR to a folder holding cudart64_*.dll
        # (TouchDesigner's bin folder works) unless a CUDA toolkit is on PATH.
        if: inputs.e2e
        shell: pwsh
        env:
          TDRIVE_CUDART_DIR: ${{ vars.TDRIVE_CUDART_DIR }}
        run: |
          if ($env:TDRIVE_CUDART_DIR) { $env:PATH = "$env:TDRIVE_CUDART_DIR;$env:PATH" }
          build\Release\texture_io_test.exe tests\texture_io\texture_io.riv cuda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows plugin
        # Bake the pinned Rive tag into the zip name so downloaders can see
        # at a glance which runtime the plugin was built against.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $riveTag = $env:RIVE_REF -replace '^runtime-', ''
          $zip = "dist\TDRive_win_rive-$riveTag.zip"
          Compress-Archive -Path build\Release\TDRiveTOP.dll -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TDRive_win
          path: dist/TDRive_win_rive-*.zip

  # ---------------------------------------------------------------------------
  release:
    # Runs on a pushed v*.*.* tag (e.g. v0.1.0, v1.2.3), or when weekly.yml
    # passes release_tag - then the tag is created here, at the tested commit.
    # Builds both platforms first via 'needs:', then attaches the prepared
    # zips to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag || '') != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: TDRive_mac
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: TDRive_win
          path: release

      - name: List release files
        run: ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/TDRive_mac_rive-*.zip
            release/TDRive_win_rive-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prepend which Rive runtime this build was compiled against so
          # downloaders can correlate plugin behaviour with a rive-runtime
          # release. The tag is also baked into each zip's filename.
          body: |
            Built against [rive-app/rive-runtime@${{ env.RIVE_REF }}](https://github.com/rive-app/rive-runtime/releases/tag/${{ env.RIVE_REF }}).
          # Tags with a semver pre-release suffix (v1.1.0-ea, v2.0.0-rc1, ...)
          # publish as GitHub prereleases instead of full releases.
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
