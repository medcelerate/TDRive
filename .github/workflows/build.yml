name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pin the Rive runtime to a specific release tag so CI builds are reproducible
# and match the runtime the plugin has been tested against. Bump this to a newer
# rive-app/rive-runtime tag (https://github.com/rive-app/rive-runtime/releases)
# to move forward deliberately, rather than tracking a moving 'main'.
env:
  RIVE_REF: runtime-v0.1.410

# Cancel in-progress runs for the same ref when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-14   # arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # rive-runtime is fetched fresh below

      - name: Install tools
        run: |
          brew update
          brew install premake cmake

      - name: Resolve Rive commit
        id: rive
        run: |
          # Pin the Rive runtime commit so the cache key is stable. If you
          # want a different commit, set RIVE_REF here or as a repo secret.
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Rive runtime
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Restore Rive build cache
        id: rive-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-macos-${{ steps.rive.outputs.sha }}-v4

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        # --with_rive_canvas compiles in GPU Canvas (RenderCanvas + the Ore
        # GPU abstraction layer, Metal backend on macOS). --with_rive_scripting
        # swaps the stub luau_vm for a real Luau VM (+ libhydrogen), which is
        # what actually makes script-driven GPU Canvas content animate - a
        # canvas without scripting allocates but nothing draws into it.
        env:
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout --with_rive_canvas --with_rive_scripting"
        run: ./scripts/build_rive.sh release

      - name: Configure plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Save Rive build cache
        # Only run after the plugin links - that's our proof the libs are
        # whole. Saves us from poisoning the cache with partial output from
        # a failed Rive build like we did before.
        if: steps.rive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-macos-${{ steps.rive.outputs.sha }}-v4

      - name: Package macOS plugin
        # Bake the pinned Rive tag into the zip name so downloaders can see
        # at a glance which runtime the plugin was built against.
        run: |
          mkdir -p dist
          RIVE_TAG="${RIVE_REF#runtime-}"
          ZIP="TDRive_mac_rive-${RIVE_TAG}.zip"
          (cd build && zip -r "../dist/${ZIP}" TDRiveTOP.plugin)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TDRive_mac
          path: dist/TDRive_mac_rive-*.zip

  # ---------------------------------------------------------------------------
  windows:
    # Pin to windows-2022 for a stable toolchain. 'windows-latest' has rolled
    # to VS 2026 (v18) and dropped VS 2022, which breaks the hardcoded
    # "Visual Studio 17 2022" CMake generator below ("could not find any
    # instance of Visual Studio"). Pinning mirrors the macos-14 pin and keeps
    # release builds reproducible.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install premake5
        shell: pwsh
        run: |
          $version = "5.0.0-beta8"
          $url = "https://github.com/premake/premake-core/releases/download/v$version/premake-$version-windows.zip"
          $dest = "$env:RUNNER_TEMP\premake"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dest\premake.zip"
          Expand-Archive -Path "$dest\premake.zip" -DestinationPath $dest
          # Add to PATH for subsequent steps.
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$dest\premake5.exe" --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve Rive commit
        id: rive
        shell: bash
        run: |
          RIVE_REF="${RIVE_REF:-main}"
          SHA=$(git ls-remote https://github.com/rive-app/rive-runtime.git "$RIVE_REF" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "Could not resolve $RIVE_REF"; exit 1; fi
          echo "ref=$RIVE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Rive runtime
        shell: bash
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/rive-app/rive-runtime.git third_party/rive-runtime
          git -C third_party/rive-runtime checkout ${{ steps.rive.outputs.sha }}
          git -C third_party/rive-runtime submodule update --init --recursive

      - name: Restore Rive build cache
        id: rive-cache
        uses: actions/cache/restore@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-windows-${{ steps.rive.outputs.sha }}-v4

      - name: Build Rive runtime
        if: steps.rive-cache.outputs.cache-hit != 'true'
        env:
          # --with_rive_text + --with_rive_layout + --with_rive_canvas: the
          # canvas flag compiles in GPU Canvas (RenderCanvas + Ore, D3D11/D3D12
          # backends on Windows) and matches Rive's own default build flags.
          # --with_rive_scripting: swap the stub luau_vm for a real Luau VM
          # (+ libhydrogen). Required for script-driven GPU Canvas content
          # (the common case in Rive editor authoring) to actually animate.
          # --no-lto: Rive's release config enables LTO on Windows, which
          # makes clang-cl emit LLVM-bitcode-wrapped COFF objs/libs that
          # MSVC's link.exe can't consume - we hit LNK1107 the moment we
          # try to link against rive*.lib from the TDRiveTOP CMake build.
          # Turning LTO off restores standard COFF that link.exe groks.
          RIVE_PREMAKE_ARGS: "--with_rive_text --with_rive_layout --with_rive_canvas --with_rive_scripting --no-lto"
          # Use ninja instead of vs2022/MSBuild. Rive's MSBuild invocation
          # doesn't pass /m, so projects build serially - ninja is fully
          # parallel and finishes in a fraction of the time on CI.
          RIVE_BUILD_SYSTEM: "ninja"
        # Args after `--` are forwarded to ninja as explicit build targets,
        # so we only build the static libs we actually link. Skipping
        # path_fiddle (the GLFW sample exe) avoids dragging GLFW + the
        # other fiddle backends into the build. luau_vm is produced by
        # --with_rive_scripting; libhydrogen isn't a standalone project,
        # its objects are linked directly into librive.
        run: scripts\build_rive.bat release -- rive rive_pls_renderer rive_decoders rive_harfbuzz rive_sheenbidi rive_yoga libpng libjpeg libwebp zlib miniaudio luau_vm

      - name: Configure plugin
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Save Rive build cache
        # Only after a successful plugin link, so we never poison the cache
        # with a half-built Rive output (this is exactly what bit us with
        # the v1 key after the path_fiddle.exe failure).
        if: steps.rive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/rive-runtime/renderer/out
          key: rive-windows-${{ steps.rive.outputs.sha }}-v4

      - name: Package Windows plugin
        # Bake the pinned Rive tag into the zip name so downloaders can see
        # at a glance which runtime the plugin was built against.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $riveTag = $env:RIVE_REF -replace '^runtime-', ''
          $zip = "dist\TDRive_win_rive-$riveTag.zip"
          Compress-Archive -Path build\Release\TDRiveTOP.dll -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TDRive_win
          path: dist/TDRive_win_rive-*.zip

      - name: Package RiveRenderStream
        # The standalone Disguise RenderStream workload (renderstream/) is built
        # by the same `cmake --build` above (WIN32-only target). It static-links
        # Rive + the MSVC runtime and loads d3renderstream.dll from the Disguise
        # install at runtime, so the bare exe needs no bundled dependencies.
        # Shipped as its own zip since it targets Disguise, not TouchDesigner.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $riveTag = $env:RIVE_REF -replace '^runtime-', ''
          $zip = "dist\RiveRenderStream_win_rive-$riveTag.zip"
          Compress-Archive -Path build\Release\RiveRenderStream.exe -DestinationPath $zip -Force

      - name: Upload RiveRenderStream artifact
        uses: actions/upload-artifact@v7
        with:
          name: RiveRenderStream_win
          path: dist/RiveRenderStream_win_rive-*.zip

  # ---------------------------------------------------------------------------
  release:
    # Runs only on a v*.*.* tag (e.g. v0.1.0, v1.2.3). Builds both platforms
    # first via 'needs:', then attaches the prepared zips to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: TDRive_mac
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: TDRive_win
          path: release

      - name: Download RiveRenderStream artifact
        uses: actions/download-artifact@v8
        with:
          name: RiveRenderStream_win
          path: release

      - name: List release files
        run: ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TDRive_mac_rive-*.zip
            release/TDRive_win_rive-*.zip
            release/RiveRenderStream_win_rive-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prepend which Rive runtime this build was compiled against so
          # downloaders can correlate plugin behaviour with a rive-runtime
          # release. The tag is also baked into each zip's filename.
          body: |
            Built against [rive-app/rive-runtime@${{ env.RIVE_REF }}](https://github.com/rive-app/rive-runtime/releases/tag/${{ env.RIVE_REF }}).
          # Tags with a semver pre-release suffix (v1.1.0-ea, v2.0.0-rc1, ...)
          # publish as GitHub prereleases instead of full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
